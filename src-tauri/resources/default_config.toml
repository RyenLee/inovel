[app]
name = "iNovel"
version = "1.0.0"
environment = "development"
description = "一款现代化的小说创作工具"

[gzip]
enabled = true
level = 6
min_size = 1024
compress_types = [
    "application/json",
    "text/plain",
    "text/html",
    "text/css",
    "text/javascript",
    "application/javascript",
    "application/xml",
    "text/xml",
]

[cache]
enabled = true
max_entries = 1000
ttl_seconds = 300
cached_commands = []

[pagination]
default_page_size = 20
max_page_size = 100

[request_merging]
enabled = true
window_ms = 100
max_batch_size = 10

[api]
base_url = "http://localhost:3000"
timeout_ms = 30000
max_retries = 3

[performance]
monitoring_enabled = true
slow_request_threshold_ms = 500
log_payload_size = false

[window]
default_width = 1200.0
default_height = 800.0
min_width = 600.0
min_height = 800.0
max_width = 1920.0
max_height = 1200.0
resizable = true

[window.portrait]
enabled = true
default_width = 800.0
default_height = 1200.0
min_width = 600.0
min_height = 800.0

[security]
api_key = ""
secret_token = ""

[features]
auto_save_enabled = true
sync_enabled = false
writing_stats_enabled = true
inspiration_board_enabled = true

[editor]
default_font_size = 16
default_font = "微软雅黑"
line_spacing = 1.5
show_line_numbers = true
spell_check_enabled = true
