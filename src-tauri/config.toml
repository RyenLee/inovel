# iNovel 应用配置文件
# 修改此文件后配置将自动热加载，无需重启应用

# ==================== Gzip 压缩配置 ====================
[gzip]
# 是否启用 gzip 压缩
enabled = true
# 压缩级别 (0-9)，0 为不压缩，9 为最高压缩率
# 推荐值：6（平衡压缩率与性能）
level = 6
# 最小压缩阈值（字节），小于此值的数据不进行压缩
min_size = 1024
# 需要压缩的 MIME 类型
compress_types = [
    "application/json",
    "text/plain",
    "text/html",
    "text/css",
    "text/javascript",
    "application/javascript",
    "application/xml",
    "text/xml",
]

# ==================== 缓存配置 ====================
[cache]
# 是否启用缓存
enabled = true
# 最大缓存条目数
max_entries = 1000
# 缓存过期时间（秒）
ttl_seconds = 300
# 需要缓存的命令列表（支持通配符）
cached_commands = [
    "get_chapter_tree",
    "list_characters",
    "list_locations",
    "list_organizations",
    "get_relationships",
    "list_events",
    "get_builtin_templates",
    "get_inspiration_board",
    "get_writing_stats",
    "get_recent_projects",
]

# ==================== 分页配置 ====================
[pagination]
# 默认每页条数
default_page_size = 20
# 最大每页条数
max_page_size = 100

# ==================== 请求合并配置 ====================
[request_merging]
# 是否启用请求合并
enabled = true
# 合并窗口时间（毫秒），在此时间窗口内的相同请求将被合并
window_ms = 300
# 最大批量大小
max_batch_size = 50

# ==================== API 端点配置 ====================
[api]
# 基础 URL（用于外部 API 调用）
base_url = ""
# 请求超时时间（秒）
timeout_seconds = 30
# 失败重试次数
retry_count = 3
# 重试间隔（毫秒）
retry_delay_ms = 1000

# ==================== 性能监控配置 ====================
[performance]
# 是否启用性能监控
monitoring_enabled = true
# 慢请求阈值（毫秒），超过此值的请求将被记录
slow_request_threshold_ms = 1000
# 是否记录请求/响应大小
log_payload_size = true
