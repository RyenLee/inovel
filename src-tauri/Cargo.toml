[package]
name = "inovel"
version = "1.1.2"
description = "一款现代化的小说创作工具"
authors = ["ryenlii"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "inovel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-opener = { version = "2.5.4" }
tauri-plugin-dialog = { version = "2.7.1" }
tauri-plugin-updater = "2.10.1"
tauri-plugin-prevent-default = "5.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rusqlite = { version = "0.39.0", features = ["bundled"] }
chrono = { version = "0.4.44", features = ["serde"] }
lazy_static = "1.5.0"
rand = "0.10.1"
git2 = "0.20.4"
aho-corasick = "1.1.4"
epub-builder = "0.8.3"
zip = "8.6.0"
walkdir = "2.5.0"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
regex = "1.12.3"
thiserror = "2.0.18"
anyhow = "1.0.102"
toml = "1.1.2"
flate2 = "1.1.9"
notify = { version = "8.2.0", default-features = false, features = [
    "macos_kqueue",
] }
lru = "0.18.0"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
dirs = "6.0.0"
